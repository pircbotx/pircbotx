name: gradle snapshot

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # TODO
    # strategy:
    #   matrix:
    #     java: [ '8', '17 ]

    env:
      GRADLE_OPTS: "-Dhttps.protocols=TLSv1.2 -Djava.awt.headless=true -Dorg.gradle.console=plain"
      REVIEWDOG_OPTS: "-reporter=github-check -diff 'git diff ${{  github.event.pull_request.base.sha || github.event.before }}'"

    steps:
      #
      # environment setup
      #
      - uses: actions/checkout@v4

      - name: Setup build - JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup build - Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup lint - reviewdog
        uses: reviewdog/action-setup@v1

      - name: Setup lint - scarfco
        run: curl -sfL https://raw.githubusercontent.com/mallowlabs/scarfco/main/install.sh | sh -s

      #
      # build
      #

      - name: Build - Gradle Build
        run: ./gradlew --stacktrace build shadowJar codeAnalysis "-Psnapshot.version=-$( git rev-parse --short=7 HEAD )"

      - name: Reproducible Build Hashes
        run: sha256sum build/libs/*.jar

      - name: Github Upload
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/libs/*.jar

      #
      # Reporting
      #

      - name: Lint - Publish Test Report
        if: always()
        uses: scacap/action-surefire-report@v1
        with:
          report_paths: 'build/test-results/test/*.xml'

      - name: Lint - checkstyle
        run: reviewdog -name=jcheckstyle -f=checkstyle $REVIEWDOG_OPTS < build/reports/checkstyle/main.xml
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}
        continue-on-error: true

      - name: Lint - spotbugs
        run: bin/scarfco build/reports/spotbugs/main.xml | reviewdog -name=spotbugs -f=checkstyle $REVIEWDOG_OPTS
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}
        continue-on-error: true

      - name: Lint - pmd
        run: bin/scarfco build/reports/pmd/main.xml | reviewdog -name=pmd -f=checkstyle $REVIEWDOG_OPTS
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}
        continue-on-error: true

      - name: Lint - Github Action itself
        uses: reviewdog/action-actionlint@v1
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.reviewdog_token }}
        continue-on-error: true
        with:
          reporter: github-check
          level: warning
